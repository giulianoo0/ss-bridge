name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev xorg-dev \
            libvulkan-dev vulkan-tools libfontconfig1-dev libgles2-mesa-dev

      - name: Build (macOS universal)
        if: matrix.name == 'macos'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/ss-bridge \
            target/aarch64-apple-darwin/release/ss-bridge \
            target/x86_64-apple-darwin/release/ss-bridge

      - name: Build (Linux / Windows)
        if: matrix.name != 'macos'
        run: cargo build --release

      - name: Install create-dmg
        if: matrix.name == 'macos'
        run: brew install create-dmg

      - name: Package macOS (.app + sign + dmg)
        if: matrix.name == 'macos'
        env:
          SIGN_ID: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          CERT_B64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          AC_ID: ${{ secrets.APPLE_ID }}
          AC_PWD: ${{ secrets.APPLE_APP_PASSWORD }}
          AC_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: bash packaging/macos.sh

      - name: Package Linux
        if: matrix.name == 'linux'
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/ss-bridge-linux-x86_64.tar.gz ss-bridge

      - name: Package Windows
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/ss-bridge.exe dist/ss-bridge-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
